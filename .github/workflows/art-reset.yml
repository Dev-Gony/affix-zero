name: Art reset integrity
on:
  push:
    branches: [chore/r0-preservation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: art-reset-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  deletion-and-rule-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify zero old images and unchanged game rules
        run: python3 tools/audit_art_reset.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-reset-audit
          path: build/art-reset/audit.json
  image-free-startup:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 5
    env:
      XDG_DATA_HOME: /tmp/affix-art-reset-data
      XDG_CONFIG_HOME: /tmp/affix-art-reset-config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check both reset entries without old images or saves
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends fontconfig libfontconfig1 fonts-noto-cjk
          for project in . experiments/e0-godot; do
            timeout 60 godot --headless --editor --path "$project" --import > /tmp/reset-import.log 2>&1
            cat /tmp/reset-import.log
            ! grep -E 'SCRIPT ERROR|ERROR:|Parse Error|No loader found' /tmp/reset-import.log
            timeout 30 godot --headless --path "$project" --quit-after 3 > /tmp/reset-start.log 2>&1
            cat /tmp/reset-start.log
            ! grep -E 'SCRIPT ERROR|ERROR:|Parse Error|No loader found' /tmp/reset-start.log
          done
          echo 'ART_RESET_STARTUP PASSED (status screen only, not gameplay)'
