name: G6 playtest recovery

on:
  pull_request:
    branches:
      - dev/gameplay-v5-pets-items

permissions:
  contents: read

concurrency:
  group: g6-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 10
    env:
      XDG_DATA_HOME: /tmp/affix-recovery-data
      XDG_CONFIG_HOME: /tmp/affix-recovery-config
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install actual-render prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 xvfb xauth libgl1-mesa-dri fonts-noto-cjk
      - name: Import exact source
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/stamp_build.py
          mkdir -p build/recovery
          git ls-tree -r HEAD > build/recovery/source-manifest.txt
          set -o pipefail
          godot --headless --editor --path . --quit-after 3 -- --affix-test-mode 2>&1 | tee build/recovery/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/recovery/import.log
      - name: Verify gameplay and receipt behavior
        shell: bash
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/playtest_recovery.tscn -- --affix-test-mode 2>&1 | tee build/recovery/contracts.log
          grep -q "PLAYTEST_RECOVERY PASSED" build/recovery/contracts.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/recovery/contracts.log
      - name: Render and verify result screens and enemy redraws
        shell: bash
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a -s "-screen 0 1280x800x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy res://tests/playtest_recovery_capture.tscn -- --affix-test-mode 2>&1 | tee build/recovery/capture.log
          grep -q "PLAYTEST_RECOVERY_CAPTURE PASSED" build/recovery/capture.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/recovery/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AFFIX-ZERO-g6-recovery-evidence
          path: build/recovery/
          retention-days: 14
          if-no-files-found: error
