name: Godot smoke test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --editor --path . --quit-after 3

      - name: Run gameplay smoke test
        run: godot --headless --path . res://tests/smoke_test.tscn

      - name: Verify exported runtime resources
        shell: bash
        run: |
          mkdir -p build/runtime-smoke
          godot --headless --path . --export-pack "Windows Desktop" build/runtime-smoke/AFFIX_ZERO.pck
          set -o pipefail
          godot --headless --main-pack build/runtime-smoke/AFFIX_ZERO.pck --quit-after 8 2>&1 | tee build/runtime-smoke/runtime.log
          ! grep -E "SCRIPT ERROR|Enemy resource catalog incomplete|Loot resource catalog incomplete" build/runtime-smoke/runtime.log

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/AFFIX_ZERO.exe

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload Windows playable build
        uses: actions/upload-artifact@v4
        with:
          name: AFFIX-ZERO-windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload Web playable build
        uses: actions/upload-artifact@v4
        with:
          name: AFFIX-ZERO-web
          path: build/web/
          if-no-files-found: error
