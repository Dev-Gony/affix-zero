name: Godot smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.3"
      XDG_DATA_HOME: /tmp/affix-ci-user-data
      XDG_CONFIG_HOME: /tmp/affix-ci-config
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install test and capture prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 xvfb xauth libgl1-mesa-dri fonts-noto-cjk

      - name: Install export templates
        run: |
          mkdir -p "$XDG_DATA_HOME/godot/export_templates"
          cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Stamp build identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/stamp_build.py

      - name: Import project
        shell: bash
        run: |
          mkdir -p build/pr-a
          set -o pipefail
          godot --headless --editor --path . --quit-after 3 -- --affix-test-mode 2>&1 | tee build/pr-a/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/pr-a/import.log

      - name: Verify PR-A backup and identity safety
        shell: bash
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/pr_a_safety.tscn -- --affix-test-mode 2>&1 | tee build/pr-a/safety.log
          grep -q "PR_A_SAFETY PASSED" build/pr-a/safety.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/pr-a/safety.log

      - name: Verify PR-B pause, filter and atomic-save safety
        shell: bash
        run: |
          mkdir -p build/pr-b
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/pr_b_safety.tscn -- --affix-test-mode 2>&1 | tee build/pr-b/safety.log
          grep -q "PR_B_SAFETY PASSED" build/pr-b/safety.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/pr-b/safety.log

      - name: Verify gameplay V3 balance contracts
        shell: bash
        run: |
          mkdir -p build/gameplay-v3
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/gameplay_v3_balance.tscn -- --affix-test-mode 2>&1 | tee build/gameplay-v3/balance.log
          grep -q "GAMEPLAY_V3_BALANCE PASSED" build/gameplay-v3/balance.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/gameplay-v3/balance.log

      - name: Verify gameplay V4 elite contracts
        shell: bash
        run: |
          mkdir -p build/gameplay-v4
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/gameplay_v4_elite.tscn -- --affix-test-mode 2>&1 | tee build/gameplay-v4/elite.log
          grep -q "GAMEPLAY_V4_ELITE PASSED" build/gameplay-v4/elite.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/gameplay-v4/elite.log

      - name: Verify gameplay V4 growth-loop UX contracts
        shell: bash
        run: |
          mkdir -p build/gameplay-v4
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/gameplay_v4_growth_ux.tscn -- --affix-test-mode 2>&1 | tee build/gameplay-v4/growth-ux.log
          grep -q "GAMEPLAY_V4_GROWTH PASSED" build/gameplay-v4/growth-ux.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/gameplay-v4/growth-ux.log

      - name: Verify gameplay V4 loot-feedback contracts
        shell: bash
        run: |
          mkdir -p build/gameplay-v4
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/gameplay_v4_loot_feedback.tscn -- --affix-test-mode 2>&1 | tee build/gameplay-v4/loot-feedback.log
          grep -q "GAMEPLAY_V4_LOOT PASSED" build/gameplay-v4/loot-feedback.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/gameplay-v4/loot-feedback.log

      - name: Verify UIUX V2 management contracts
        shell: bash
        run: |
          mkdir -p build/uiux-v2
          set -o pipefail
          timeout 90 godot --headless --path . res://tests/uiux_v2_overhaul.tscn -- --affix-test-mode 2>&1 | tee build/uiux-v2/contracts.log
          grep -q "UIUX_V2 PASSED" build/uiux-v2/contracts.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/uiux-v2/contracts.log

      - name: Run existing gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . res://tests/smoke_test.tscn -- --affix-test-mode 2>&1 | tee build/pr-a/gameplay.log
          grep -q "SMOKE TEST PASSED" build/pr-a/gameplay.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/pr-a/gameplay.log

      - name: Capture baseline fixture screens
        shell: bash
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a -s "-screen 0 1280x800x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy res://tests/pr_a_capture.tscn -- --affix-test-mode 2>&1 | tee build/pr-a/capture.log
          grep -q "PR_A_CAPTURE PASSED" build/pr-a/capture.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/pr-a/capture.log

      - name: Verify exported runtime resources
        shell: bash
        run: |
          mkdir -p build/runtime-smoke
          godot --headless --path . --export-pack "Windows Desktop" build/runtime-smoke/AFFIX_ZERO.pck
          set -o pipefail
          godot --headless --main-pack build/runtime-smoke/AFFIX_ZERO.pck --quit-after 8 -- --affix-test-mode 2>&1 | tee build/runtime-smoke/runtime.log
          ! grep -E "SCRIPT ERROR|Enemy resource catalog incomplete|Loot resource catalog incomplete" build/runtime-smoke/runtime.log
          grep -q "AFFIX_BUILD_INFO" build/runtime-smoke/runtime.log

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/AFFIX_ZERO.exe

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload PR-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AFFIX-ZERO-uiux-evidence
          path: |
            build/pr-a/
            build/pr-b/
            build/gameplay-v3/
            build/gameplay-v4/
            build/uiux-v2/
          if-no-files-found: warn

      - name: Upload Windows playable build
        uses: actions/upload-artifact@v4
        with:
          name: AFFIX-ZERO-windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload Web playable build
        uses: actions/upload-artifact@v4
        with:
          name: AFFIX-ZERO-web
          path: build/web/
          if-no-files-found: error
