name: R0 preservation tool
on:
  push:
    branches: [chore/r0-preservation]
    paths:
      - 'tools/local/**'
      - 'tests/local/**'
      - '.github/workflows/r0-preflight.yml'
  pull_request:
    paths:
      - 'tools/local/**'
      - 'tests/local/**'
      - '.github/workflows/r0-preflight.yml'
permissions:
  contents: read
jobs:
  windows-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Synthetic preservation and CLI tests
        shell: ${{ matrix.shell }}
        run: ./tests/local/r0_preflight_test.ps1
