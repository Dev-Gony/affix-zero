name: R0 preservation tool
on:
  push:
    branches: ['chore/r0-preservation']
    paths:
      - 'tools/local/**'
      - 'tests/local/**'
      - '.github/workflows/r0-preflight.yml'
  pull_request:
    paths:
      - 'tools/local/**'
      - 'tests/local/**'
      - '.github/workflows/r0-preflight.yml'
permissions:
  contents: read
jobs:
  windows-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 synthetic preservation tests
        shell: powershell
        run: ./tests/local/r0_preflight_test.ps1
      - name: PowerShell 7 synthetic preservation tests
        if: always()
        shell: pwsh
        run: ./tests/local/r0_preflight_test.ps1
